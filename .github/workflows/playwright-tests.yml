name: Playwright cart persistence test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker compose build

      - name: Run tests
        env:
          BASE_URL: https://store.ui.com/us/en
          STORE_EMAIL: ${{ secrets.STORE_EMAIL }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          HEADLESS: "true"
        run: |
          cat <<EOF > .env
          BASE_URL=$BASE_URL
          STORE_EMAIL=$STORE_EMAIL
          STORE_PASSWORD=$STORE_PASSWORD
          HEADLESS=$HEADLESS
          EOF
          docker compose run --rm tests

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
